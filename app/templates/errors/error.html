{% extends 'base.html' %}

{% block title %}{{ title }} | MCST Library{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center px-4 py-16">
    <div class="w-full max-w-md text-center">
        <div class="text-5xl sm:text-7xl font-extrabold text-primary dark:text-gray-200 break-words">{{ code }}</div>
        <h1 class="mt-4 text-xl sm:text-2xl font-bold break-words">{{ title }}</h1>
        <p class="mt-2 text-sm sm:text-base text-gray-500 dark:text-gray-400 break-words">{{ message }}</p>
        <div class="mt-8 flex flex-col sm:flex-row items-stretch sm:items-center justify-center gap-2 sm:gap-3">
            <a href="{{ url_for('main.index') }}" class="px-4 py-2 bg-primary text-white text-sm font-semibold rounded hover:opacity-90">Back to Home</a>
            {% if current_user.is_authenticated %}
                <a href="{{ url_for('main.user_profile') }}" class="px-4 py-2 border border-gray-300 text-sm font-semibold rounded hover:bg-gray-100 dark:hover:bg-gray-800">Go to My Profile</a>
            {% else %}
                <a href="{{ url_for('auth.login') }}" class="px-4 py-2 border border-gray-300 text-sm font-semibold rounded hover:bg-gray-100 dark:hover:bg-gray-800">Sign In</a>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
